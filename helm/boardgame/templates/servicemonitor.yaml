{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "boardgame.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    release: monitoring
    {{- include "boardgame.labels" . | nindent 4 }}

spec:
  selector:
    matchLabels:
      {{- include "boardgame.selectorLabels" . | nindent 6 }}

  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}

  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
{{- end }}